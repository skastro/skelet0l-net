<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs>
<linearGradient id="h1" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#7A8FE0"/>
  <stop offset="0.35" stop-color="#B894D9"/>
  <stop offset="0.7" stop-color="#E663A0"/>
  <stop offset="1" stop-color="#E5BC5C"/>
</linearGradient>
<linearGradient id="h3" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#7A8FE0"/>
  <stop offset="0.5" stop-color="#B894D9"/>
  <stop offset="1" stop-color="#E663A0"/>
</linearGradient>
<filter id="glow">
  <feGaussianBlur stdDeviation="2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="aura">
  <feGaussianBlur stdDeviation="6"/>
</filter>
<filter id="soft">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="400" height="400" fill="#050208"/>

<!-- Charcoal field -->
<circle cx="200" cy="200" r="175" fill="none" stroke="#0C0916" stroke-width="20" opacity="0.45"/>
<circle cx="200" cy="200" r="148" fill="none" stroke="#110E1A" stroke-width="12" opacity="0.35"/>
<circle cx="200" cy="200" r="125" fill="none" stroke="#0C0916" stroke-width="7" opacity="0.25"/>

<!-- Minimal geometry fragments -->

<!-- One trine vertex -->
<line x1="193" y1="72" x2="200" y2="55" stroke="#B894D9" stroke-width="0.7" opacity="0.35" filter="url(#soft)"/>
<line x1="207" y1="72" x2="200" y2="55" stroke="#B894D9" stroke-width="0.7" opacity="0.35" filter="url(#soft)"/>

<!-- Bottom trine hints -->
<line x1="68" y1="282" x2="95" y2="275" stroke="#7A8FE0" stroke-width="0.6" opacity="0.2" filter="url(#soft)"/>
<line x1="332" y1="282" x2="305" y2="275" stroke="#E5BC5C" stroke-width="0.6" opacity="0.2" filter="url(#soft)"/>

<!-- Opposition fragments -->
<line x1="200" y1="55" x2="200" y2="130" stroke="url(#h3)" stroke-width="0.5" opacity="0.25" filter="url(#soft)"/>
<line x1="200" y1="270" x2="200" y2="345" stroke="url(#h3)" stroke-width="0.4" opacity="0.15" filter="url(#soft)"/>

<!-- Cardinal dots -->
<circle cx="200" cy="60" r="1.5" fill="#B894D9" opacity="0.3" filter="url(#soft)"/>
<circle cx="340" cy="200" r="1.3" fill="#E663A0" opacity="0.25" filter="url(#soft)"/>
<circle cx="200" cy="340" r="1.3" fill="#E5BC5C" opacity="0.2" filter="url(#soft)"/>
<circle cx="60" cy="200" r="1.3" fill="#7A8FE0" opacity="0.25" filter="url(#soft)"/>

<!-- Star aura -->
<path d="M200 145 L211 189 L255 200 L211 211 L200 255 L189 211 L145 200 L189 189 Z" 
  fill="url(#h1)" opacity="0.03" filter="url(#aura)"/>

<!-- THE STAR -->
<path d="M200 145 L211 189 L255 200 L211 211 L200 255 L189 211 L145 200 L189 189 Z" 
  fill="none" stroke="url(#h1)" stroke-width="2.2" opacity="0.9" filter="url(#glow)"/>
<path d="M200 163 L207 193 L237 200 L207 207 L200 237 L193 207 L163 200 L193 193 Z" 
  fill="url(#h1)" opacity="0.07"/>

<!-- Seed -->
<circle cx="200" cy="200" r="2.5" fill="#F5F5F0" opacity="0.5" filter="url(#glow)"/>
<circle cx="200" cy="200" r="1" fill="#FFF" opacity="0.9"/>
</svg>