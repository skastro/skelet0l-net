[build]
  publish = "."

# Redirect old page URLs to desktop with correct page open
[[redirects]]
  from = "/music/*"
  to = "/?open=music"
  status = 302

[[redirects]]
  from = "/about/*"
  to = "/?open=about"
  status = 302

[[redirects]]
  from = "/collaborate/*"
  to = "/?open=collaborate"
  status = 302

[[redirects]]
  from = "/os/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/desktop/*"
  to = "/"
  status = 301

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
